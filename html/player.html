<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Player | webRPG</title>
		<link rel="stylesheet" href="../css/style.css" />
	</head>
	<body>
		<nav class="site-nav" aria-label="Main navigation">
			<a class="site-nav__brand" href="index.html">webRPG</a>
			<a href="alchemy_crafting.html">Alchemy</a>
			<a class="site-nav__active" href="player.html" aria-current="page">Player</a>
		</nav>
		<main class="profile-layout">
			<header class="page-heading">
				<p class="eyebrow">Character</p>
				<div class="profile-name-heading">
					<h1 data-profile-name>Loading player...</h1>
					<button class="icon-button" type="button" data-change-name aria-label="Change character name" title="Change character name">&#9998;</button>
				</div>
			</header>
			<section class="profile-card" aria-labelledby="stats-heading">
				<p class="eyebrow">Overview</p>
				<h2 id="stats-heading">Player state</h2>
				<dl class="stat-list">
					<div><dt>Level</dt><dd data-profile-level>-</dd></div>
					<div><dt>Experience</dt><dd data-profile-experience>-</dd></div>
					<div><dt>Health</dt><dd data-profile-hp>-</dd></div>
					<div><dt>Coins</dt><dd data-profile-coins>-</dd></div>
					<div><dt>Gems</dt><dd data-profile-gems>-</dd></div>
				</dl>
			</section>
			<section class="inventory-panel" aria-labelledby="inventory-heading">
				<div class="section-heading">
					<div>
						<p class="eyebrow">Collected items</p>
						<h2 id="inventory-heading">Inventory</h2>
					</div>
					<span class="item-count" data-inventory-count>0 items</span>
				</div>
				<ul class="inventory-list" data-inventory-list></ul>
				<p class="empty-state" data-inventory-empty>Your inventory is empty.</p>
			</section>
			<dialog data-item-dialog>
				<form method="dialog">
					<p class="eyebrow">Item details</p>
					<h2 data-dialog-item-name>Item</h2>
					<dl class="detail-list" data-item-details></dl>
					<button value="close">Close</button>
				</form>
			</dialog>
			<dialog data-name-dialog>
				<form method="dialog" data-name-form>
					<p class="eyebrow">Character</p>
					<h2>Change name</h2>
					<label class="name-field" for="character-name">Name</label>
					<input id="character-name" name="name" type="text" maxlength="30" required data-name-input />
					<div class="dialog-actions">
						<button class="button button--secondary" value="cancel">Cancel</button>
						<button class="button button--primary" value="save">Save</button>
					</div>
				</form>
			</dialog>
		</main>
		<script type="module">
			import { initPlayerUI } from "../js/controllers/player_controller.js";
			import { initProfileUI } from "../js/controllers/profile_controller.js";
			import { initAreaTheme } from "../js/controllers/areas_controller.js";

			initAreaTheme();
			initPlayerUI();
			initProfileUI();
		</script>
	</body>
</html>
