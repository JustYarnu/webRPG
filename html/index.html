<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>webRPG</title>
	</head>
	<body>
		<main>
			<h1 data-player-name>Loading...</h1>
			<p data-player-status>Player state is loading.</p>
			<dl>
				<div>
					<dt>Level</dt>
					<dd data-player-level>-</dd>
                    <dd data-player-experience>-</dd>
				</div>
				<div>
					<dt>HP</dt>
					<dd data-player-hp>-</dd>
				</div>
				<div>
					<dt>Coins</dt>
					<dd data-player-coins>-</dd>
				</div>
				<div>
					<dt>Gems</dt>
					<dd data-player-gems>-</dd>
				</div>
			</dl>
			<button type="button" data-add-xp>Add 10 XP</button>
			<button type="button" data-open-area-picker>Select area</button>
			<button type="button" data-explore>Explore</button>
			<p data-selected-area>No area selected.</p>
			<p data-area-status>Areas are loading.</p>
			<p data-explore-result></p>
			<dialog data-area-dialog>
				<form method="dialog">
					<h2>Select an area</h2>
					<div data-area-list></div>
					<button type="submit">Cancel</button>
				</form>
			</dialog>
			<dialog data-event-dialog>
				<form method="dialog">
					<h2 data-event-title>Event found</h2>
					<p data-event-message></p>
					<button value="cancel">Cancel</button>
					<button value="engage">Engage</button>
				</form>
			</dialog>
		</main>
		<script type="module" src="../js/controllers/player_controller.js"></script>
		<script type="module" src="../js/controllers/areas_controller.js"></script>
		<script type="module" src="../js/controllers/explore_controller.js"></script>
	</body>
</html>
