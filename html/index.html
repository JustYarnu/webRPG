<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>webRPG</title>
		<link rel="stylesheet" href="../css/style.css" />
	</head>
	<body class="game-screen">
		<nav class="site-nav" aria-label="Main navigation">
			<a class="site-nav__brand" href="index.html">webRPG</a>
			<a href="alchemy_crafting.html">Alchemy</a>
			<a href="player.html">Player</a>
		</nav>
		<main class="game-board">
			<section class="player-info-panel" aria-label="Player information">
				<h1 data-player-name>Loading player...</h1>
				<p><span data-player-level>Level -</span><br /><span data-player-experience>0</span> XP</p>
				<div class="xp-progress" aria-label="Experience progress">
					<span data-xp-progress></span>
				</div>
				<p class="visually-hidden" data-player-status>Player state is loading.</p>
				<span class="visually-hidden" data-player-hp>-</span>
				<span class="visually-hidden" data-player-coins>-</span>
				<span class="visually-hidden" data-player-gems>-</span>
				<a href="player.html">View inventory</a>
			</section>
			<section class="area-select-panel" aria-label="Area selection">
				<button class="rail-button" type="button" data-open-area-picker>Select area</button>
			</section>
			<section class="right-rail" aria-label="Exploration status">
				<div class="history-belt" data-history-belt aria-label="Exploration history"></div>
			</section>
			<section class="exploration-center">
				<p class="current-area-label">Current area: <span data-selected-area>No area selected.</span></p>
				<p class="area-description" data-area-status>Areas are loading.</p>
				<div class="explore-control">
					<button class="explore-button" type="button" data-explore>
						<span>Explore</span>
						<span class="explore-cooldown" data-explore-cooldown aria-hidden="true"></span>
					</button>
				</div>
				<p class="xp-notification" data-xp-notification hidden>XP notification</p>
			</section>
			<dialog data-area-dialog>
				<form method="dialog">
					<h2>Select an area</h2>
					<ul class="area-list" data-area-list></ul>
					<button class="button button--secondary" type="submit">Cancel</button>
				</form>
			</dialog>
		</main>
		<script type="module">
			import { initPlayerUI } from "../js/controllers/player_controller.js";
			import { initAreaPicker } from "../js/controllers/areas_controller.js";
			import { initExploreUI } from "../js/controllers/explore_controller.js";

			initPlayerUI();
			initAreaPicker();
			initExploreUI();
		</script>
	</body>
</html>
