<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Forage Event</title>
	</head>
	<body>
		<main>
			<h1>Forage Event</h1>
			<p data-forage-status>Searching the area...</p>
			<a href="index.html">Return to exploration</a>
			<dialog data-forage-dialog>
				<form method="dialog">
					<h2>You found something</h2>
					<p data-item-name></p>
					<button value="leave">Leave it</button>
					<button value="take">Take it</button>
				</form>
			</dialog>
		</main>
		<script type="module">
			import { initForageUI } from "../js/controllers/forage_controller.js";
			import { initAreaTheme } from "../js/controllers/areas_controller.js";

			initAreaTheme();
			initForageUI();
		</script>
	</body>
</html>
